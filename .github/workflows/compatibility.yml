name: Kaggle SSH compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vscode-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the official Linux VS Code CLI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          from vscode_tunnel import install_vscode_cli
          with tempfile.TemporaryDirectory() as directory:
              cli = install_vscode_cli(Path(directory) / "bin")
              subprocess.run([str(cli), "--cli-data-dir", str(Path(directory) / "state"),
                              "tunnel", "--tunnel-id", "syntax-check", "--cluster", "asse",
                              "--host-token", "test-only-token", "--name", "kaggle", "--help"], check=True)
          PY
  linux-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n install_ssh_server.sh add_ngrok_token.sh run_ssh_server.sh tests/integration_ssh.sh
      - name: Check scripts with ShellCheck
        run: shellcheck install_ssh_server.sh add_ngrok_token.sh run_ssh_server.sh tests/integration_ssh.sh
      - name: Test missing host keys, password login, environment and repeated setup
        run: docker run --rm -v "$PWD:/workspace:ro" -w /workspace "${{ matrix.image }}" bash tests/integration_ssh.sh
