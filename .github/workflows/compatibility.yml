name: Kaggle notebook compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate and validate notebooks
        run: |
          python3 update_notebooks.py
          git diff --exit-code -- notebook_example.ipynb fork-of-ssh-kaggle-visualstudiocode-9d17dd.ipynb
          python3 -m unittest discover -s tests -v
